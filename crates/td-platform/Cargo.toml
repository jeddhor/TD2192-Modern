[package]
name = "td-platform"
description = "SDL3 platform layer: window, presentation, input, audio device, timing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
td-input.workspace = true
td-render.workspace = true
sdl3.workspace = true
thiserror.workspace = true
tracing.workspace = true

# MDG §8.2 permits a reviewed, justified td-platform exception. Keep unsafe denied
# here and allow it only in windows_console.rs; every other crate remains forbid.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
