# Resource map for file0001.exe (Episode 1). See README.md in this folder and ADR-0003.
# Offsets are FILE offsets of the ShortString length byte. Never put the text itself here.
#
# Id conventions (M1-11, RE-3, 2026-11-02):
#   e1.mission.NN.title  one pstring per mission title card (NN = 01..20)
#   e1.mission.NN.cards  the story-card strings that follow that title (locations, relative
#                        times, captions), in file order; the campaign flow (M1-04) decides
#                        which are shown when
#   e1.ending            episode-end lines
#   <area>[.<n>]         other groups, one pstring_seq per run of consecutive ShortStrings;
#                        a suffix .01, .02 ... numbers the runs of one routine in file order
# Generated from the RE-3 string export and checked with `tdtool exe-res` (2026-11-02).
exe = "file0001.exe"
sha256 = "96184a677d8dd8724b6c267a354104f6915c4a21d6d0822af1c4ce3ccd9e7998"

