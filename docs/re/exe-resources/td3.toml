# Resource map for td3.exe. See README.md in this folder and ADR-0003.
# Offsets are FILE offsets of the ShortString length byte. Never put the text itself here.
# M1-11, RE-3, 2026-11-02. Ids follow file0001.toml, with the prefix "e3." on every id (resource ids
# share one namespace across all maps). Groups were found from the string export and the routines
# that reference them; their meaning mirrors the Episode 1 routine at the same place.
